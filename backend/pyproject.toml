[project]
name = "neuro-backend"
version = "0.1.3"
description = "Backend for Neuro project"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.110.1",
    "uvicorn[standard]==0.29.0",
    "sqlmodel==0.0.16",
    "alembic==1.13.1",
    "pydantic[email]==2.6.4",
    "pydantic-settings==2.2.1",
    "celery==5.3.6",
    "redis==5.0.3",
    "chromadb==0.4.24",
    "numpy==1.26.4",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.1.2",
    "python-multipart==0.0.9",
    "httpx==0.27.0",
    "sentence-transformers==2.6.1",
    "pymupdf==1.24.0",
    "pyyaml==6.0.1",
    "typer==0.12.3",
    "aiosqlite==0.20.0",
    "networkx==3.2.1",
]

[project.scripts]
neuro = "app.cli:app"

[project.optional-dependencies]
voice = [
    "pipecat-ai>=0.0.40",
]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
    "pip-audit>=2.7.0",
    "bandit>=1.7.8",
]
observability = [
    "sentry-sdk[fastapi]>=2.0.0",
    "prometheus-client>=0.20.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "F403", "UP042", "E402"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "normal"
check_untyped_defs = true
disallow_untyped_defs = false
disable_error_code = [
    "import-untyped",
    "no-any-return",
]

[tool.bandit]
skips = ["B101", "B105", "B108", "B110", "B112", "B311", "B404", "B602", "B603", "B605", "B606", "B607"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
