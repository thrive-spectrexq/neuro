[project]
name = "neuro-backend"
version = "0.1.1"
description = "Backend for Neuro project"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "sqlmodel==0.0.42",
    "alembic==1.19.1",
    "pydantic[email]==2.13.5",
    "pydantic-settings==2.15.0",
    "celery==5.6.3",
    "redis==8.1.0",
    "chromadb==1.5.9",
    "python-jose[cryptography]==3.5.0",
    "bcrypt==5.0.0",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    "sentence-transformers==6.0.1",
    "pymupdf==1.28.2",
    "pyyaml==6.0.3",
    "typer==0.27.2",
    "aiosqlite==0.22.1",
    "networkx==3.6.1",
]

[project.scripts]
neuro = "app.cli:app"

[project.optional-dependencies]
voice = [
    "pipecat-ai>=0.0.40",
]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
    "pip-audit>=2.7.0",
    "bandit>=1.7.8",
]
observability = [
    "sentry-sdk[fastapi]>=2.0.0",
    "prometheus-client>=0.20.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "F403", "UP042", "E402"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "normal"
check_untyped_defs = true
disallow_untyped_defs = false
disable_error_code = [
    "import-untyped",
    "no-any-return",
]

[tool.bandit]
skips = ["B101", "B110", "B112", "B603", "B607"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["app"]
