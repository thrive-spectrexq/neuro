name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install "numpy==1.26.4"
        pip install -e ".[dev]"

    - name: Run Ruff Linting
      working-directory: ./backend
      run: ruff check .

    - name: Run Ruff Formatting Check
      working-directory: ./backend
      run: ruff format --check .

    - name: Run Mypy Type Check
      working-directory: ./backend
      run: mypy app/

    - name: Run Security Audit
      working-directory: ./backend
      run: pip-audit

    - name: Run Tests with Coverage
      working-directory: ./backend
      env:
        NPY_DISABLE_CPU_FEATURES: "AVX512F AVX512CD AVX512_SKX AVX512_CLX AVX512_CNL AVX512_ICL"
      run: pytest --cov=app --cov-report=term-missing

  frontend-test:
    name: Frontend Tests (Turborepo)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile

    - name: Run Linting
      run: pnpm turbo run lint

    - name: Run Typecheck
      run: pnpm turbo run typecheck

    - name: Run Dependency Audit
      run: pnpm audit --prod --audit-level=high

    - name: Run Tests
      run: pnpm turbo run test

  build-clipper:
    name: Build Clipper Extension
    runs-on: ubuntu-latest
    needs: [frontend-test]
    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile

    - name: Build Clipper
      run: pnpm turbo run build --filter="@neuro/clipper"

  build-desktop:
    name: Build Desktop App
    runs-on: ${{ matrix.os }}
    needs: [frontend-test]
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --no-frozen-lockfile

    - name: Build Web & Shared Packages First
      run: pnpm turbo run build --filter="@neuro/web" --filter="@neuro/shared" --filter="@neuro/ui" --filter="@neuro/sdk"

    - name: Build Electron App
      run: pnpm turbo run build --filter="@neuro/desktop"
